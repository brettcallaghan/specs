# A dispatch branch whose rebase onto the target conflicts.
#
# The same shape as `dispatch-stale-base` — the branch is cut from an
# earlier target and the case is concurrent — except that both sides
# rewrote the SAME line of `work.txt`. The rebase therefore stops on a
# named path, which is what a sequencing finding reports.
#
# Measured on the built bundle: `git rebase
# origin/claude/bead-bonanza-fixture` on `bb/dev-fixture-2` exits 1,
# "CONFLICT (content): Merge conflict in work.txt", and
# `git diff --name-only --diff-filter=U` names `work.txt`.
#
#   repository.bundle  the core's three commits; 99ce1dd on
#                      `bb/dev-fixture-2` off ac4a37c, writing one line of
#                      work.txt; and 078f2b6 on the sprint branch, writing
#                      the same line differently.
#   tracker.jsonl      two closed beads the finding names — fixture-run.3,
#                      the unmerged dispatch's, and fixture-run.4, whose
#                      commit is the one on the target it conflicts with.

kind = "variant"
contract_version = "2.0"

description = """A drained dispatch whose branch conflicts with the target it would \
rebase onto: both sides rewrote the same line of work.txt, so the rebase stops with \
work.txt unmerged and both beads are nameable in the finding."""

prefix = "fixture"
run = "fixture-run"

# A remote that refuses a push.
#
# Derived from the core fixture: the history and the tracker are the
# core's. What makes this world is the remote, which the harness stands up
# from the declaration below — a real bare repository with a real
# `pre-receive` hook, so the refusal comes back through git the way a
# server's does rather than being faked above it.
#
#   repository.bundle  copied from the core fixture, byte for byte.
#   tracker.jsonl      copied from the core fixture, byte for byte.
#
# The refusal is scoped to a ref namespace rather than to everything,
# because that is the case worth proving: a push carrying a refused path
# lands nothing, and the report has to name the path that was refused. A
# remote refusing every ref could not tell that report apart from a
# remote that was simply unreachable.

kind = "variant"
contract_version = "2.0"

description = """A run whose remote refuses the sprint branch: the push is rejected by \
the remote's own pre-receive hook, so no commit in it lands and the refused ref path is \
nameable."""

prefix = "fixture"
run = "fixture-run"

[refusing_remote]
name = "origin"
refuses = "refs/heads/claude/*"
message = "refusing refs/heads/claude/*: this remote does not accept sprint branches"

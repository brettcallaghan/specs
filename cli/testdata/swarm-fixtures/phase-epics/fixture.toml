# A run whose phase epics are variously eligible, blocked and already
# closed.
#
# Derived from the core fixture: this scenario needs no different history,
# only a different tracker export read against it.
#
#   repository.bundle  copied from the core fixture, byte for byte.
#   tracker.jsonl      the core's run epic and its two beads, plus three
#                      phase epics under the run — one open with every
#                      child closed (eligible), one open with an open
#                      child (not eligible, and that child's id is the
#                      reason), and one already closed (passed over).
#
# All three outcomes are present on purpose: a world carrying only the
# eligible one could not tell a walk that closes what it should from one
# that closes everything it finds.

kind = "variant"
contract_version = "2.0"

description = """A run carrying three phase epics, one of each outcome: Phase A is open \
with every child closed and so eligible, Phase B is open with an open child that is the \
reason it stays open, and Phase C is already closed."""

prefix = "fixture"
run = "fixture-run"

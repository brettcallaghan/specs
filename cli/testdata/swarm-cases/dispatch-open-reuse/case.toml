# The core fixture's manifest already records a sprint branch. Opening a
# dispatch reuses it and creates nothing.

fixture = "core"
args = ["dispatch", "open", "--run", "fixture-run"]
exit = 0
ac = ["AC-SWARM-DISP-003.2"]

# A second invocation is the proof it created nothing the first time:
# both read the same recorded branch back.
[[after]]
args = ["dispatch", "open", "--run", "fixture-run"]
exit = 0

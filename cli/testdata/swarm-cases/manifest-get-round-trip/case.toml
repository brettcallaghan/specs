# A value a shell would mangle survives the round trip through the real
# tracker and out of `get --key`.
#
# The unit tests assert the rendering; this asserts the whole path — the
# value is written through `bd`, stored, read back, and printed. Nothing
# between the two invocations is faked, so a tracker that trimmed
# whitespace or ate an escape would be caught here and nowhere else.
#
# The value carries every hazard at once: inner double whitespace, a real
# newline, a tab, a leading dash on the second line, and a trailing space.
# It comes back double-quoted rather than as a block scalar, and the
# trailing space is why — a block's last content line may end in white
# space by the specification, and readers disagree about whether it does,
# so the renderer writes the form they agree on.

fixture = "core"
args = [
  "manifest", "set", "--run", "fixture-run",
  "--key", "findings_path", "--value", '"docs/two  spaces\n  --leading-dash\tafter-a-tab "',
]
exit = 0
ac = ["AC-SWARM-CORE-002.20"]

# Nothing is normalized. The answer carries no duration and no digest —
# both are provenance, and provenance is what --full-result is for — so
# every byte below is asserted.

# Read it back. The answer is the property and its value, so what is
# compared is the value itself and not a report about it.
[[after]]
args = ["manifest", "get", "--run", "fixture-run", "--key", "findings_path"]
exit = 0

# A manifest whose keys are all present, correctly typed and mutually
# consistent validates clean, against the real binary and a real tracker.
#
# The unit tier can only show that the rules hold over a document a test
# built. This shows they hold over a record a tracker actually stored and
# handed back, which is the guard the unit tier cannot provide.
#
# The keys of a later stage are not established — the run has not reached
# them — so a clear answer does not carry them at all. What they are
# waiting on is in the full result, which is where a caller who asked how
# the verdict was reached looks.

fixture = "core"
args = ["manifest", "validate", "--run", "fixture-run", "--stage", "scope"]
exit = 0
ac = ["AC-SWARM-CORE-002.16"]

# Nothing is normalized. A clear answer carries the properties the
# command established and nothing else, so it holds no duration and no
# digest, and every byte below is asserted.

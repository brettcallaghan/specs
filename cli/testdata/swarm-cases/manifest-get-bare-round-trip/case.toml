# A value a shell would mangle survives the round trip through the real
# tracker and out of `get --key`.
#
# The unit tests assert the rendering; this asserts the whole path — the
# value is written through `bd`, stored, read back, and printed. Nothing
# between the two invocations is faked, so a tracker that trimmed
# whitespace or ate an escape would be caught here and nowhere else.
#
# The value carries all three hazards at once: inner double whitespace, a
# real newline, a tab, a leading dash on the second line, and a trailing
# space. The expected artifact is those exact bytes plus the one newline
# the bare form terminates with.

fixture = "core"
args = [
  "manifest", "set", "--run", "fixture-run",
  "--key", "findings_path", "--value", '"docs/two  spaces\n  --leading-dash\tafter-a-tab "',
]
exit = 0
ac = ["AC-SWARM-CORE-002.20"]

[[normalize]]
pattern = "[0-9]+ms"
with = "<duration>"
why = "a real invocation's elapsed time varies per run"

[[normalize]]
pattern = "sha256:[0-9a-f]{64}"
with = "sha256:<digest>"
why = "the digest covers the tracker's own output, which carries state this case does not pin"

# Read back bare. The whole of stdout is the value: that is what makes
# `x=$(swarm manifest get ...)` the entire read.
[[after]]
args = ["manifest", "get", "--run", "fixture-run", "--key", "findings_path"]
exit = 0

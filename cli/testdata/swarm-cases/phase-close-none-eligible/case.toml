# The core fixture's only epic under the run — the target — has one
# child still in progress, so nothing is eligible to close. The command
# still reports why the target stays open, and exits clear.

fixture = "core"
args = ["phase", "close", "--run", "fixture-run"]
exit = 0
ac = ["AC-SWARM-DISP-001.4"]

# A second invocation against the same world proves the first wrote
# nothing: the target is still open, so a second run reports the same
# answer rather than a narrower one.
[[after]]
args = ["phase", "close", "--run", "fixture-run"]
exit = 0

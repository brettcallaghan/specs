# Plugin-scoped configuration for the sf agent-plugins toolkit.
#
# Per ADR-022 ("Projects Declare Checkpoint Scripts"): a project declares the
# executables its skills run, by repository-root-relative path, in this file.
# Skills run them and read their output; they parse no prose.
#
# The alternatives ADR-022 rejected, so they are not re-proposed here: a
# `.specs/hooks/` convention (one character from the `specs/` corpus root and
# meaning something entirely different), `specs.toml` (a per-corpus-root
# manifest, and this repository has two), and `.env` (conventionally
# gitignored, so the declaration would not travel with the repository).

# The checks run before every bead's close — the quality bar for one commit,
# not the release bar. Anything that takes minutes, or only means something
# across the whole repository at release time, belongs in CI instead.
#
# Two keys each, nothing else accepted. `command` runs through `sh -c` with
# the repository root as its working directory. Order is execution order and
# every check runs even after one fails; `bb-checks.py` enforces both, so
# neither is something this file has to remember.
#
# Literal strings (single quotes) do no escape processing, so a shell
# one-liner survives verbatim.

[[checks]]
id = "format"
command = 'scripts/format-check'

[[checks]]
id = "vet"
command = 'cd cli && go vet ./...'

[[checks]]
id = "build"
command = 'cd cli && go build ./...'

[[checks]]
id = "test-go"
command = 'cd cli && go test ./...'

[[checks]]
id = "skills"
command = 'scripts/check-skills.sh'

[[checks]]
id = "shared-refs"
command = 'scripts/sync-shared-references.sh --check'

[[checks]]
id = "strata-docs"
command = 'scripts/sync-strata-docs.sh --check'

[[checks]]
id = "schemas"
command = 'scripts/generate-schemas.sh --check'

# The corpus checks. Fast enough to pay per bead — measured 481ms for the
# build-and-check pair, 34ms and 27ms for the two link/drift scripts — and each
# catches a defect a bead can introduce in one commit, which is the test for
# belonging here rather than in CI.
[[checks]]
id = "corpus"
command = 'cd cli && go build -o ../build/spec ./spec && cd .. && build/spec check --strict'

[[checks]]
id = "ref-links"
command = 'scripts/check-reference-links.py'

[[checks]]
id = "template-drift"
command = 'scripts/check-template-drift.py'

# The bundled scripts' own invocation-surface tests. Each needs no database, no
# repository and no network, which is what makes them runnable as a check.
[[checks]]
id = "script-self-tests"
# NOT `set -e` and NOT `&&`: either stops at the first failure and hides the
# rest, which is the exact rule bb-checks.py exists to enforce. This records
# every status and fails at the end.
#
# pre-flight-check.sh IS included. It was excluded on the claim that its
# --self-test falls through to the environment probe and pushes a ref. That is
# false: the arg loop runs `self_test; exit $?` before any probe. Measured on a
# clean tree — it emits zero BB_* facts, leaves `git worktree list` at the same
# count, and adds no refs/dolt/preflight-probe-* on the remote. It asserts the
# invocation surface, the portability guards, and (since --json) that both
# output modes carry the same keys.
#
# plugin/hooks/bb-stop-ready-loop.sh is here for a stronger reason than the
# others: it is a Stop hook that can BLOCK a session, so its bound — at most N
# consecutive blocks, then it stands down — is the difference between a
# convenience and a trap. Its --self-test stubs `bd` on PATH and points the
# state directory at a temp dir, so it needs no database either.
#
# plugin/monitors/bb-events-monitor.sh --self-test appends to real files in a
# temp directory and waits for its own background tails to report, so it is
# the slow one here — about ten seconds, and it is timing-sensitive by nature.
command = 'rc=0; for t in plugin/skills/bead-bonanza/scripts/bb-status.sh plugin/skills/bead-bonanza/scripts/bb-close-bead.sh plugin/skills/bead-bonanza/scripts/sprint-cleanup.sh plugin/skills/bead-bonanza/scripts/bb-checks.py plugin/skills/bead-bonanza/scripts/pre-flight-check.sh plugin/hooks/bb-stop-ready-loop.sh plugin/monitors/bb-events-monitor.sh; do "$t" --self-test || rc=1; done; exit $rc'

# Green since 2026-08-22. It exits 1 on a WARNING as well as an error, which is
# the point: a skill body over the cap is a real defect and this is what says
# so. Kept separate from `skills` so a future warning fails one check rather
# than marking a healthy one red.
[[checks]]
id = "skills-strict"
command = 'scripts/check-skills.sh --strict'

[models]
# Capability tiers, least to most capable. Beads carry a tier in
# `metadata.tier`; the orchestrator resolves it here at dispatch. A tier left
# undeclared is reported as such and never guessed.
light = "haiku"
standard = "sonnet"
advanced = "opus"
frontier = "fable"

[run]
# Project-level run defaults. These are the authorization gate's seven rows:
# `sprint-scope` resolves each from here when the key is present and from its
# own default when it is absent, then puts the RESOLVED set to the human as one
# confirmation.
#
# Setting a key changes WHAT is confirmed, never WHETHER it is. The gate still
# runs even with all seven set — a run that stops asking is a run that
# authorized itself. What you buy is one sentence instead of seven questions.
#
# Omit a key to take the skill default, which is always "do the smaller thing
# and say so". The manifest records every row's value AND its source, so a
# project-level default cannot hide from whoever reads the report.

# "defer_push" — the orchestrator pushes per wave (skill default)
# "push_per_bead" — each subagent pushes its own branch
push_mode = "defer_push"

# "draft" — open as draft at the start, mark ready at the end (skill default)
# "ready" — open ready for review
# "none"  — open none; the branch is pushed and that is all
# pull_request = "draft"

# false — a bead belonging to another epic is EXCLUDED and the run goes
#         narrower (skill default). true — move it into this run's epic.
# move_foreign_beads = false

# false — review findings are filed as beads but NOT worked in this run
#         (skill default). true — admit them and re-enter the wave loop.
# admit_review_findings = false

# "once"  — escalate one tier on repeated failure, once, and report it
#           (skill default). "never" — report the failure, do not escalate.
# tier_escalation = "once"

# Review loops. 2 = three passes total (skill default). 0 disables the loop;
# the single review still runs.
# review_budget = 2

# false — never merge to the default branch; that is the pull request's job,
#         not the run's (skill default).
# merge_to_default = false

# run_root: where a run's directory is created. Defaults to
#           ${TMPDIR:-/tmp}/claude/bead-bonanza when unset. Not a gate row.
# run_root = ""

[review]
# The code reviewer a sprint runs at its review step. We do not ship one —
# harnesses provide one, the ecosystem is full of them, and reviewing a diff is
# the most generic thing in a sprint. What is not generic is what happens to
# the findings, and that is the sprint's job, not the reviewer's.
#
# Same shape as `[[checks]]`: the project says what to run, the run runs it and
# acts on what comes back. Exactly one of two keys:
#
#   skill   = "<name>"    dispatch a skill by name; it returns a report
#   command = '<sh -c>'   run a command from the repository root; stdout is the
#                         report
#
# UNDECLARED IS NOT AN ERROR, AND NOT A SKIP. `sprint-review` falls back: a
# review skill available in the session, else a plain agent reviewing the diff
# with no skill. The report names which of the three ran, because a review by
# the declared reviewer and one by a bare agent are not the same evidence.
skill = "code-review"

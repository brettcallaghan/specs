# Plugin-scoped configuration for the sf agent-plugins toolkit.
#
# Per ADR-022 ("Projects Declare Checkpoint Scripts"): a project declares the
# executables its skills run, by repository-root-relative path, in this file.
# Skills run them and read their output; they parse no prose.
#
# The alternatives ADR-022 rejected, so they are not re-proposed here: a
# `.specs/hooks/` convention (one character from the `specs/` corpus root and
# meaning something entirely different), `specs.toml` (a per-corpus-root
# manifest, and this repository has two), and `.env` (conventionally
# gitignored, so the declaration would not travel with the repository).

# The checks run before every bead's close — the quality bar for one commit,
# not the release bar. Anything that takes minutes, or only means something
# across the whole repository at release time, belongs in CI instead.
#
# Two keys each, nothing else accepted. `command` runs through `sh -c` with
# the repository root as its working directory. Order is execution order and
# every check runs even after one fails; `bb-checks.py` enforces both, so
# neither is something this file has to remember.
#
# Literal strings (single quotes) do no escape processing, so a shell
# one-liner survives verbatim.

[[checks]]
id = "format"
command = 'scripts/format-check'

[[checks]]
id = "vet"
command = 'cd cli && go vet ./...'

[[checks]]
id = "build"
command = 'cd cli && go build ./...'

[[checks]]
id = "test-go"
command = 'cd cli && go test ./...'

[[checks]]
id = "skills"
command = 'scripts/check-skills.sh'

[[checks]]
id = "shared-refs"
command = 'scripts/sync-shared-references.sh --check'

[[checks]]
id = "strata-docs"
command = 'scripts/sync-strata-docs.sh --check'

[[checks]]
id = "schemas"
command = 'scripts/generate-schemas.sh --check'

# The corpus checks. Fast enough to pay per bead — measured 481ms for the
# build-and-check pair, 34ms and 27ms for the two link/drift scripts — and each
# catches a defect a bead can introduce in one commit, which is the test for
# belonging here rather than in CI.
[[checks]]
id = "corpus"
command = 'cd cli && go build -o ../build/spec ./spec && cd .. && build/spec check --strict'

[[checks]]
id = "ref-links"
command = 'scripts/check-reference-links.py'

[[checks]]
id = "template-drift"
command = 'scripts/check-template-drift.py'

# KNOWN RED, for one file. It exits 1 on a WARNING — a body-size figure that
# moves with every editorial change — so the bar is "no findings beyond the
# recorded baseline", not "exit 0". Declared separately from `skills` so the
# baseline can carry one failing check without marking a healthy one red.
# Retires when `groom-beads` fits the cap; it is the only warning left.
[[checks]]
id = "skills-strict"
command = 'scripts/check-skills.sh --strict'

[models]
# Capability tiers, least to most capable. Beads carry a tier in
# `metadata.tier`; the orchestrator resolves it here at dispatch. A tier left
# undeclared is reported as such and never guessed.
light = "haiku"
standard = "sonnet"
advanced = "opus"
frontier = "fable"

[run]
# Project-level run defaults — things this repository owns, as opposed to
# things a run decides. Omit a key to leave the decision to the run.
#
# push_mode: "defer_push" (the orchestrator pushes per bucket) or
#            "push_per_bead" (each subagent pushes its own branch).
push_mode = "defer_push"

# run_root: where a run's directory is created. Defaults to
#           ${TMPDIR:-/tmp}/claude/bead-bonanza when unset.
# run_root = ""

[review]
# The code reviewer a sprint runs at its review step. We do not ship one —
# harnesses provide one, the ecosystem is full of them, and reviewing a diff is
# the most generic thing in a sprint. What is not generic is what happens to
# the findings, and that is the sprint's job, not the reviewer's.
#
# Same shape as `[[checks]]`: the project says what to run, the run runs it and
# acts on what comes back. Exactly one of two keys:
#
#   skill   = "<name>"    dispatch a skill by name; it returns a report
#   command = '<sh -c>'   run a command from the repository root; stdout is the
#                         report
#
# UNDECLARED IS NOT AN ERROR — the run skips the review step and SAYS SO in its
# report. A silently skipped review reads exactly like a clean one.
skill = "code-review"

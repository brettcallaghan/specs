# Beads Configuration File
# Settings can also be set via BD_* environment variables or command flags.
# See `bd config --help` for the full key list.

# JSONL auto-export: OFF. `.beads/*.jsonl` is gitignored and is not how issues
# travel — the Dolt remote below is. Do not turn this back on: JSONL-as-sync is
# an anti-pattern in beads' own docs, and the export is unstable under diff —
# an import-then-export of an UNCHANGED tracker rewrites ~45% of records,
# because dependencies re-serialize in a different order and comment ids are
# re-minted, so tracking it buries real changes in ~1 MB of churn.
#
# `bd export > .beads/issues.jsonl` by hand gives a snapshot for a viewer or
# for interchange. It is not a backup.
export:
    auto: false
# The tracker: issues live in a Dolt database on DoltHub
# (bcallaghan/beads, prefix `specs-`). There is no JSONL fallback by design.
#
# KEEP IT SET. `bd bootstrap` clones from this URL, and it is what makes
# `bd prime` emit the Dolt sync commands; unset, bd tells every agent "No git
# remote configured. Issues are saved locally only."
#
# DoltHub authenticates with a Dolt credential, not a GitHub token: the
# SessionStart hook installs it from DOLT_CREDS_JWK — see
# .claude/hooks/session-start.sh and docs/session-bootstrap.md.
#
# The closed history from before the move (690 beads, `agent-plugins-` prefix)
# is a one-time export under docs/archive/, not in this database.
sync:
    remote: "https://doltremoteapi.dolthub.com/bcallaghan/beads"

# Never re-import a JSONL found lying around: the Dolt remote is the source of
# truth, and a stale export would overwrite newer rows.
import:
    auto: false

# Off explicitly so no stray `.beads/backup/` copy appears; it never reaches
# the remote either way.
backup:
    enabled: false

# Pushing is the Stop hook's job (.claude/hooks/dolt-push.sh), once per turn.
# bd's own auto-push is unsafe with more than one writer. Nothing pushed to
# DoltHub can be squashed afterwards — `bd dolt remote reset-data` does not
# support DoltHub URLs — so never run `bd flatten` on this database again.
dolt:
    auto-push: false
    auto-commit: "on"

# Integration settings (access with 'bd config get/set')
# Non-secret keys live in the database: jira.url, jira.project, linear.team_id,
# github.org, github.repo. For secrets prefer env vars (LINEAR_API_KEY,
# GITHUB_TOKEN) over storing them in this tracked file.

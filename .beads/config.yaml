# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
# issue-prefix: ""

# Use no-db mode: JSONL-only, no Dolt database
# When true, .beads/issues.jsonl is the only local store
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by BEADS_ACTOR or --actor)
# actor: ""

# Export events (audit trail) to .beads/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'bd export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - bd-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# Dolt-native backup (periodic backup for off-machine recovery)
# This is full database backup only. Cross-machine sync uses Dolt remotes.
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-backups
#   git-push: false    # Disable git push (backup locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# JSONL auto-export: OFF, and .beads/*.jsonl is no longer tracked.
#
# Retired by agent-plugins-92q.31 (2026-08-11). It was on because the Dolt
# database was per-session and disposable, which made .beads/issues.jsonl the
# only thing carrying issues between sessions and branches. That premise is
# gone: `bd dolt push` reaches origin's refs/dolt/data, the SessionStart hook
# bootstraps from it, and the remote is the source of truth. beads' own
# documentation names JSONL-as-sync an anti-pattern, and bd init --help says
# the same: "Cross-machine sync and backups use Dolt remotes/backups, not
# JSONL import/export."
#
# What turning it off buys, beyond correctness: a 1.1 MB generated file stopped
# being rewritten into every bead commit. Measured 2026-08-11 — a plain
# import-then-export of an UNCHANGED tracker rewrote 65 of 146 records, because
# dependencies re-serialize in a different order and every comment id is
# re-minted. The file churned ~45% of itself regardless of what a session
# actually changed, which made its git history useless as a record of intent.
#
# Run `bd export > .beads/issues.jsonl` by hand if you want a snapshot for a
# viewer or for interchange. It is gitignored; it is not a backup, and it is
# not how issues travel.
export:
  auto: false

# Integration settings (access with 'bd config get/set')
# Non-secret keys (stored in the database):
# - jira.url, jira.project
# - linear.team_id
# - github.org, github.repo
#
# Secret keys (stored in this file but prefer env vars to avoid git exposure):
# - linear.api_key  → use LINEAR_API_KEY env var instead
# - github.token    → use GITHUB_TOKEN env var instead

# The Dolt remote IS the tracker. Committed deliberately, replacing a comment
# that said the opposite.
#
# The previous value was "git+http://local_proxy@127.0.0.1:41729/git/..." — the
# loopback address of one ephemeral container's egress proxy, meaningless in any
# other clone. It was removed, and the comment replacing it concluded that Dolt
# sync "does not work in this project" because `bd dolt push` returned 403.
#
# That conclusion was wrong, and the correction is worth keeping: the 403 came
# from the egress proxy substituting a brokered GitHub App token scoped to
# refs/heads, NOT from GitHub refusing refs/dolt/* writes. Proof — a push with a
# deliberately invalid token still succeeded, which only happens if the proxy
# replaced the credential. With the proxy bypassed and a real PAT, writes work
# (agent-plugins-92q.31).
#
# The SessionStart hook establishes and VERIFIES that write path on every
# session and fails loudly when it cannot. There is no JSONL fallback by
# design; see .claude/hooks/session-start.sh and docs/session-bootstrap.md.
sync:
  remote: "git+https://github.com/brettcallaghan/agent-plugins"

# A second spec root, for the RFC queue.
#
# The repository root's specs.toml declares `specs/`. RFCs carry the same
# frontmatter and drift the same way, but they are their own slug
# namespace and cite documents outside this root, so they are checked
# through a separate config with a narrowed rule set rather than by
# widening the corpus root:
#
#   spec check --config rfcs/specs.toml \
#     --only frontmatter/parse,frontmatter/schema \
#     --only frontmatter/missing-property,slug/pattern-mismatch
#
# The corpus-global rules (reference/*, slug/duplicate) are deliberately
# not requested — cross-root citations would report as unresolved. The
# report renders them not-requested rather than passed, so the narrowed
# scope stays visible rather than implied.
#
# `root = "."` resolves relative to this file's directory, so this config
# covers rfcs/ whatever the working directory.

[workspace]
name = "agent-plugins-rfcs"
root = "."

[profile]
name = "specs"

[conventions]
line_width = 80

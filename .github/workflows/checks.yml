name: checks

# The framework's own thesis is that quality comes from gates rather than
# diligence, and until now the two scripts enforcing this repo's invariants
# were run only when somebody remembered to. This is that gate.
#
# Two jobs, because they answer different questions with different
# blast radii:
#
#   checks — are this repository's skills, vendored copies and templates
#            intact? bash and stdlib python3 only, no dependency install.
#   corpus — do this repository's own specification documents conform,
#            according to the Spec CLI it ships? Needs a Go toolchain to
#            build that binary. Covers specs/ and rfcs/.
#
# The corpus job is the dogfooding one: this repository's own documents,
# checked by the binary it ships. It names its roots through specs.toml
# — specs/ at the repository root, rfcs/ through rfcs/specs.toml — rather
# than through globs, and the corpus/empty rule fails a root that matched
# nothing rather than reporting a healthy count over an empty set.

# Triggers: a pull request that is ready for review, a merge to the default
# branch, and manual dispatch. A push to a working branch runs nothing, and
# neither does a draft pull request — see the `if` on each job below.
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set (opened, synchronize,
    # reopened); without it, taking a pull request out of draft would not
    # start the run that the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: skill invariants and vendored references
    runs-on: ubuntu-latest
    # Draft pull requests are skipped at the job rather than filtered at the
    # trigger: a job that skips still reports a check run, which branch
    # protection counts as satisfied, whereas a workflow that never triggers
    # leaves a required check pending forever and blocks the merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships bash 5 and python3; both scripts need only those.
      - name: Report tool versions
        run: |
          bash --version | head -1
          python3 --version

      # --strict: it exits 1 on a WARNING as well as an error, which is the
      # point — a skill body over the ~20,000-byte cap is a real defect and
      # this is what says so. It was known-red while bead-bonanza/SKILL.md sat
      # at 55 KB; that cleared, so the gate is on.
      - name: Skill invariants
        run: scripts/check-skills.sh --strict

      # The bundled scripts' own invocation-surface tests. Nothing here needs a
      # database, a repository or a network, which is what makes them runnable
      # on a bare runner.
      #
      # pre-flight-check.sh is DELIBERATELY ABSENT: its --self-test falls
      # through to the full environment probe, which pushes a probe ref to
      # origin and runs `git worktree prune` on the checkout.
      #
      # No `set -e` and no `&&`: either would stop at the first failure and
      # hide the rest.
      - name: Bundled scripts' self-tests
        run: |
          d=plugin/skills/bead-bonanza/scripts
          rc=0
          for t in bb-status.sh bb-close-bead.sh sprint-cleanup.sh bb-checks.py; do
            "$d/$t" --self-test || rc=1
          done
          exit $rc

      # --check rather than a write: CI verifies the vendored copies are
      # current, and a stale copy is fixed by running the script locally and
      # committing the result, so the diff stays visible in review.
      - name: Vendored shared references are current
        run: scripts/sync-shared-references.sh --check

      # A skill's reference directory travels to an adopting repository
      # with no corpus index behind it, so a markdown link that does not
      # resolve to a co-located file is dead on arrival there. `spec
      # check` only walks the corpus (the `corpus` job below) and does
      # not see this surface at all.
      - name: Reference links resolve
        run: scripts/check-reference-links.py

      # Structural check on the templates every document is authored from:
      # the property set a template declares must match its type's schema.
      # Needs no dependency — only the generated bundle and the
      # frontmatter keys.
      #
      # continue-on-error until agent-plugins-3xx (rfc-template has drifted
      # from the Rfc schema) and agent-plugins-j5n (work-order is not in the
      # DocumentType vocabulary) close. Both need a decision rather than a
      # fix, and gating on defects that predate this step would land CI red.
      # agent-plugins-9fx flips it to gating.
      - name: Templates match their type's schema
        continue-on-error: true
        run: scripts/check-template-drift.py

  # Dogfooding: this repository's own specs/ corpus, checked by the
  # binary this repository ships.
  #
  # Why this exists when cli.yml already runs
  # TestProfileSelfApplicationAgainstThisRepositorysCorpus over the same
  # documents: that test drives the LIBRARY — corpus.Build and
  # Corpus.Check called in-process, with the spec root and workspace name
  # written as Go literals. It proves the profile's schema has not
  # drifted from the templates it mirrors. It does not read specs.toml,
  # does not exercise the command surface, and cannot fail on an exit
  # status, so none of what an adopting repository actually depends on is
  # covered by it.
  #
  # This job runs the delivered artifact the way an adopting repository
  # runs it: build the binary, let it discover specs.toml on its own,
  # and fail the build on its exit status. A regression in configuration
  # resolution, in the command surface, or in the exit-code mapping shows
  # up here and nowhere else.
  #
  # Built from source rather than downloaded from a release, so that a
  # CLI change and a corpus change are gated against each other at the
  # same commit. An adopting repository would install a release binary
  # instead; that path is gated by cli.yml's no-runtime job.
  corpus:
    name: this repository's own specs conform
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in cli/go.mod, and cli.yml's
          # GO_VERSION. Bump all three together.
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Build the Spec CLI
        working-directory: cli
        run: go build -o "$GITHUB_WORKSPACE/spec" ./spec

      # The index is the primary artifact, not a by-product of checking:
      # the FRD's own framing, and the reason a central catalogue can
      # consume it without running a single check. Emitting it to stdout
      # keeps this step honest — the file it would otherwise write is
      # gitignored, so a broken index could pass unnoticed as a
      # side-effect nobody reads.
      - name: Build the index
        run: ./spec index --out - > specs-index.json

      # Uploaded so the artifact a catalogue consumes is inspectable from
      # a failed run, rather than only reproducible locally.
      - uses: actions/upload-artifact@v4
        with:
          name: specs-index
          path: specs-index.json

      # --strict: any finding at all fails the build, including the
      # warning and unverified severities that exit zero by default. A
      # repository that dogfoods its own tool has no business shipping
      # findings it has decided to live with.
      - name: Check every document
        run: ./spec check --strict

      # The RFC queue, checked by the same binary through a second
      # specs.toml (rfcs/specs.toml, root "."). RFCs carry the same
      # frontmatter as corpus members and drift the same way, but they
      # are their own slug namespace and cite documents outside that
      # root, so the rule set is narrowed to the document-local rules.
      # The corpus-global rules (reference/*, slug/duplicate) are
      # deliberately not requested — cross-root citations would report as
      # unresolved. The report renders them not-requested rather than
      # passed, so the narrowed scope is visible rather than implied.
      - name: The RFC queue conforms
        run: |
          ./spec check --config rfcs/specs.toml \
            --only frontmatter/parse,frontmatter/schema,frontmatter/missing-property,slug/pattern-mismatch
name: checks

# The framework's own thesis is that quality comes from gates rather than
# diligence, and until now the two scripts enforcing this repo's invariants
# were run only when somebody remembered to. This is that gate.
#
# Two jobs, because they answer different questions with different
# blast radii:
#
#   checks — are this repository's skills and vendored copies intact?
#            bash and python3 only.
#   corpus — do this repository's own specification documents conform,
#            according to the Spec CLI it ships? Needs a Go toolchain to
#            build that binary.
#
# The corpus job is the dogfooding one. It exists because the gate that
# preceded it did not do what its name claimed: scripts/validate-corpus.py
# globbed docs/**/*.md, and the specs/ reorganization (4388c06) emptied
# that path. It kept reporting "checked 26 documents" — every one of them
# an RFC or a skill reference — while every document under specs/ went
# unchecked from the reorg until this job landed. A gate that reports a
# healthy count over the wrong files is worse than no gate, so this job
# names its root through specs.toml and the script below now fails rather
# than passing over an empty set.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: skill invariants and vendored references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships bash 5 and python3; both scripts need only those.
      - name: Report tool versions
        run: |
          bash --version | head -1
          python3 --version

      # Not --strict: bead-bonanza/SKILL.md is 859 lines against a 500-line
      # guidance, and gating on a warning that predates this workflow would
      # land CI red. Tracked to be flipped on once that clears.
      - name: Skill invariants
        run: scripts/check-skills.sh

      # --check rather than a write: CI verifies the vendored copies are
      # current, and a stale copy is fixed by running the script locally and
      # committing the result, so the diff stays visible in review.
      - name: Vendored shared references are current
        run: scripts/sync-shared-references.sh --check

      - name: Install schema validation dependencies
        run: python3 -m pip install --quiet jsonschema pyyaml

      # Validates frontmatter against the generated JSON Schema for each
      # document's type, for the documents that live OUTSIDE the Spec
      # CLI's corpus root — rfcs/ and the skills' bundled references.
      # specs/ is checked by the `corpus` job below, with the real
      # binary. See the script's own docstring for why the split exists.
      #
      # Not gated anywhere yet: that the generated artifacts under cli/
      # and plugin/skills/spec/references/generated/ are current with
      # schemas/*.strata. That check is scripts/generate-schemas.sh
      # --check, and it needs the strata compiler, which has no
      # installable release binary yet — building it from source would
      # add a Rust toolchain and several minutes to every run. Until then
      # regeneration is a local step, and the drift it would catch shows
      # up as an unexplained diff in review.
      - name: Frontmatter conforms outside the corpus root
        run: scripts/validate-corpus.py

  # Dogfooding: this repository's own specs/ corpus, checked by the
  # binary this repository ships.
  #
  # Why this exists when cli.yml already runs
  # TestProfileSelfApplicationAgainstThisRepositorysCorpus over the same
  # documents: that test drives the LIBRARY — corpus.Build and
  # Corpus.Check called in-process, with the spec root and workspace name
  # written as Go literals. It proves the profile's schema has not
  # drifted from the templates it mirrors. It does not read specs.toml,
  # does not exercise the command surface, and cannot fail on an exit
  # status, so none of what an adopting repository actually depends on is
  # covered by it.
  #
  # This job runs the delivered artifact the way an adopting repository
  # runs it: build the binary, let it discover specs.toml on its own,
  # and fail the build on its exit status. A regression in configuration
  # resolution, in the command surface, or in the exit-code mapping shows
  # up here and nowhere else.
  #
  # Built from source rather than downloaded from a release, so that a
  # CLI change and a corpus change are gated against each other at the
  # same commit. An adopting repository would install a release binary
  # instead; that path is gated by cli.yml's no-runtime job.
  corpus:
    name: this repository's own specs conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in cli/go.mod, and cli.yml's
          # GO_VERSION. Bump all three together.
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Build the Spec CLI
        working-directory: cli
        run: go build -o "$GITHUB_WORKSPACE/spec" ./spec

      # The index is the primary artifact, not a by-product of checking:
      # the FRD's own framing, and the reason a central catalogue can
      # consume it without running a single check. Emitting it to stdout
      # keeps this step honest — the file it would otherwise write is
      # gitignored, so a broken index could pass unnoticed as a
      # side-effect nobody reads.
      - name: Build the index
        run: ./spec index --out - > specs-index.json

      # Uploaded so the artifact a catalogue consumes is inspectable from
      # a failed run, rather than only reproducible locally.
      - uses: actions/upload-artifact@v4
        with:
          name: specs-index
          path: specs-index.json

      # Covers a gap in `spec check` itself, and is not permanent.
      #
      # A document whose frontmatter parses as YAML but does not fit the
      # document envelope — an out-of-vocabulary `status`, say — is
      # indexed with a `parse_error` and no `frontmatter`
      # (AC-SPEC-002.4). corpus.Check skips exactly those entries,
      # because there is no parsed frontmatter to check them against, and
      # the run then reports every rule as `passed`. So the single worst
      # document in a corpus is the one `spec check --strict` is
      # guaranteed to stay silent about. Filed as agent-plugins-5xo with
      # the fix designed; until it lands, the index is where that fact
      # lives, so read it from there.
      #
      # The FRD already says which side this belongs on: an index
      # containing parse failures exits zero because "a build failure is
      # the checker's job, not the indexer's" (REQ-SPEC-002's rationale).
      # This step is that job, standing in.
      - name: No document failed to parse
        run: |
          set -euo pipefail
          broken="$(jq -r '.entries[] | select(.parse_error) | "\(.path): \(.parse_error.message)"' specs-index.json)"
          if [ -n "$broken" ]; then
            echo "documents indexed with a parse error:"
            echo "$broken"
            exit 1
          fi
          echo "no parse errors"

      # --strict: any finding at all fails the build, including the
      # warning and unverified severities that exit zero by default. A
      # repository that dogfoods its own tool has no business shipping
      # findings it has decided to live with.
      - name: Check every document
        run: ./spec check --strict

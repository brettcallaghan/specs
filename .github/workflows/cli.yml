name: cli

# The Go gates for the Spec CLI, and the portability evidence for
# REQ-SPEC-009 that only a real matrix can produce.
#
# Why this is a second workflow rather than more jobs in checks.yml: that
# one is a single ubuntu runner over the docs corpus and needs no
# toolchain beyond bash and python3. This one needs a Go toolchain and
# three operating systems, and its failures mean something different. Two
# workflows keep the two signals legible and let each evolve without
# disturbing the other.
#
# There is deliberately no `paths:` filter. A filtered workflow that is
# required for merge never reports on a pull request that does not touch
# its paths, which blocks the merge rather than passing it; the cost of
# running the matrix on a docs-only commit is the price of avoiding that.
#
# This matrix is the most expensive thing this repository runs — on a
# private repository macOS minutes bill at 10x and Windows at 2x — so it
# is held to the narrowest trigger set that still gates a merge: a pull
# request that is ready for review, a merge to the default branch, and
# manual dispatch. Pushes to a working branch run nothing, and draft pull
# requests are skipped by the `if` on each job below.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set (opened, synchronize,
    # reopened); without it, taking a pull request out of draft would not
    # start the run that the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the `go` directive in cli/go.mod. Bump both together.
  GO_VERSION: "1.24"

jobs:
  # The cross-platform half of AC-SPEC-009.7. The expected artifacts
  # under cli/testdata/cases/**/expected/ are one committed set of bytes;
  # this job holds all three operating systems to them. The other half —
  # a CRLF working tree — is reproduced synthetically inside the suite by
  # cli/cmd/portability_test.go, so it runs on every leg here too.
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Draft pull requests are skipped at the job rather than filtered at the
    # trigger: a job that skips still reports a check run, which branch
    # protection counts as satisfied, whereas a workflow that never triggers
    # leaves a required check pending forever and blocks the merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      # Do not cancel the other legs on the first failure: which
      # platforms diverged is the whole diagnostic when a portability
      # test fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Report tool versions
        run: go version

      # gofmt on one platform only: it reads the same committed bytes
      # everywhere (.gitattributes pins the working tree to LF), so three
      # runs would report the same answer three times.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -l reported:"
            echo "$unformatted"
            echo "run 'cd cli && gofmt -w .' and commit the result"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # Statement coverage across all three test layers, and the gate that
  # keeps the numbers published in the README honest.
  #
  # One platform only: coverage is a property of which statements the
  # tests reach, and the suite is required to behave identically on all
  # three (the matrix above is what proves that), so measuring it three
  # times would report the same answer three times and then have to
  # decide which one the README quotes.
  #
  # It re-runs the tests rather than reusing the matrix's run because an
  # instrumented run is a different build: the end-to-end leg needs a
  # binary built with `go build -cover`, and the in-process legs are
  # split into two profiles the ordinary `go test ./...` does not
  # produce.
  coverage:
    name: coverage across unit, snapshot and end-to-end layers
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Statement counts come from the toolchain, so this must match
          # the version a contributor regenerates the README with.
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      # --check measures, then fails if README.md does not already say
      # what was measured. The alternative — a job that commits the
      # regenerated README — would put the number outside review, which
      # is where an unnoticed coverage drop lives.
      - name: Measure coverage and verify the README is current
        run: scripts/coverage.sh --check

      # Written whether the check passed or failed, so a stale-README
      # failure can be diagnosed from the run rather than reproduced.
      - name: Publish the tables to the run summary
        if: always()
        run: cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-coverage
          path: |
            build/coverage/summary.md
            build/coverage/coverage-func.txt
            build/coverage/coverage.html
            build/coverage/coverage.out
          if-no-files-found: warn

  # AC-SPEC-009.7's "produced by cross-compilation from a single source":
  # every platform in the release matrix is built here, on one Linux
  # runner, from the same checkout. A target that stops cross-compiling
  # fails this job on the pull request that broke it rather than on the
  # release tag.
  cross-compile:
    name: cross-compile the release matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Build every target
        env:
          # No cgo: this is what makes the artifact a single static file
          # with no libc to find at run time (AC-SPEC-009.4).
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "==> $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o /dev/null ./spec
          done

  # AC-SPEC-009.4's worked example, run rather than asserted: the binary
  # is executed in an image holding a shell, busybox's coreutils and
  # nothing else — no Go toolchain, no libc beyond musl, no package
  # manager. A binary that acquired a dynamic dependency fails here.
  no-runtime:
    name: runs with no language runtime installed
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Build the static linux/amd64 binary
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/spec" ./spec

      - name: The binary is statically linked
        run: |
          set -euo pipefail
          description="$(file -b spec)"
          echo "$description"
          # `file` rather than `ldd`: ldd's wording for a static binary
          # varies by distribution ("not a dynamic executable" against
          # "statically linked") and its exit status is not a reliable
          # signal either way.
          case "$description" in
            *"statically linked"*) ;;
            *)
              echo "spec is not statically linked; it will not run in a bare image"
              exit 1
              ;;
          esac

      - name: Run it in an image containing only a shell and the binary
        run: |
          set -euo pipefail
          # busybox is a shell plus coreutils. The corpus is one of the
          # committed snapshot fixtures, so the run has something real to
          # check and a known exit status (0: the fixture is clean).
          docker run --rm \
            -v "$PWD/spec:/spec:ro" \
            -v "$PWD/cli/testdata/cases/check-json/input:/corpus:ro" \
            -w /corpus \
            busybox:latest \
            /spec check --json

name: release

# Publishes a GitHub release of the `specs` CLI when a stage pull request
# merges.
#
# `release cut` stops at the stage pull request (a `cut/<version>` branch
# carrying CHANGELOG.md and the plugin manifest's version); tagging and
# publication are this workflow's. Everything runs in one workflow: a tag
# pushed with GITHUB_TOKEN triggers no other workflow, so an
# `on: push: tags` workflow would never fire.
#
# Distribution has two channels, and the archives are only the second:
#
#  1. `go install github.com/brettcallaghan/specs/cli/specs@<tag>`
#     — the Go module proxy is a package registry that supports on-premises
#     mirroring (AC-SPEC-009.6). It needs nothing from here beyond the tag.
#  2. The archives built below, for a machine with no Go toolchain.
#     Downloading one retrieves an already-built artifact and runs no
#     install-time code (AC-SPEC-009.5).
#
# The tag is `cli/vX.Y.Z`, not `vX.Y.Z`: the Go module lives in `cli/`, and
# the module proxy resolves a subdirectory module's versions only from tags
# carrying that prefix. Channel 1 does not work without it.
#
# Re-running a failed run finishes a partial release: the tag step accepts a
# tag already on the merge commit, assets upload with --clobber, and the
# release stays a draft until every asset is attached.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per stage branch; never cancel a publication midway.
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

env:
  # Matches the `go` directive in cli/go.mod. Bump them together.
  GO_VERSION: "1.24"
  STAGE_PREFIX: cut/
  TAG_PREFIX: cli/v
  # An awk prelude setting v to the version a `## ` heading names (`## 1.2.0`,
  # `## [1.2.0] - date`, `## v1.2.0`), or "" when it names none.
  SECTION_VERSION: >-
    /^## / {
    v = $2; sub(/^\[/, "", v); sub(/\]$/, "", v); sub(/^v/, "", v);
    if (v !~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+].*)?$/) v = ""
    }

jobs:
  publish:
    name: tag, build and publish
    runs-on: ubuntu-latest
    # A stage branch from a fork never reaches a publication credential. The
    # prefix is a signal, not an authorization: the verify step checks the
    # merged commit itself.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'cut/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Full history and tags: the verify and publish steps read tags.
          fetch-depth: 0

      - name: Verify the release commit
        run: |
          set -euo pipefail
          version="${HEAD_REF#"$STAGE_PREFIX"}"
          tag="$TAG_PREFIX$version"
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          # Plain MAJOR.MINOR.PATCH; prereleases are not published here.
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            fail "stage branch $HEAD_REF does not name a version"
          fi

          # The newest version section of CHANGELOG.md is the one cut wrote.
          # A level-2 heading that names no version (`## Unreleased`) is
          # preamble.
          top=""
          if [ -f CHANGELOG.md ]; then
            top="$(awk "$SECTION_VERSION"' v != "" { print v; exit }' CHANGELOG.md)"
          fi
          if [ "$top" != "$version" ]; then
            fail "CHANGELOG.md's newest section is '${top:-none}', not $version"
          fi

          # The plugin manifest ships the same version as the stage; a release
          # is never tagged while it carries another.
          plugin_version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$plugin_version" != "$version" ]; then
            fail "plugin/.claude-plugin/plugin.json's version is '$plugin_version', not $version"
          fi

          # A tag already on this commit is a re-run; anywhere else, a collision.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at="$(git rev-parse "$tag^{commit}")"
            if [ "$at" != "$MERGE_SHA" ]; then
              fail "tag $tag already exists at $at, not at the merge commit $MERGE_SHA"
            fi
          fi

          [ "$failed" -eq 0 ] || exit 1
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      # The gates run again here rather than being trusted from the stage
      # pull request's own run: a released binary that was never tested is
      # worse than a slower release. They run before the tag, so a failure
      # here leaves nothing to clean up.
      - name: Gates
        working-directory: cli
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Tag the merge commit
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already tags $MERGE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION" "$MERGE_SHA"
          git push origin "refs/tags/$TAG"

      - name: Build every target
        run: scripts/build-release.sh "v$VERSION" dist

      - name: The linux/amd64 binary reports the release version
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          tar -xzf "dist/specs_v${VERSION}_linux_amd64.tar.gz" -C "$dir"
          got="$("$dir/specs" --version)"
          echo "$got"
          case "$got" in
            *"v$VERSION"*) ;;
            *) echo "::error::specs --version printed '$got', expected v$VERSION"; exit 1 ;;
          esac

      - name: Write the release notes
        run: |
          set -euo pipefail
          # The body of CHANGELOG.md's section for this version, without its
          # heading: everything up to the next `## ` heading, with no leading
          # or trailing blank lines.
          awk -v want="$VERSION" "$SECTION_VERSION"'
            /^## / { if (found) exit; if (v == want) { found = 1; next } }
            !found { next }
            /^[[:space:]]*$/ { if (started) blank++; next }
            { while (blank > 0) { print ""; blank-- }; started = 1; print }
          ' CHANGELOG.md > dist/notes.md
          # printf rather than a heredoc: a heredoc inside a YAML block
          # scalar carries the block's indentation into every line.
          printf '%s\n' \
            "" \
            "## Install" \
            "" \
            "**From the Go module proxy** (needs a Go toolchain, and works against an on-premises proxy):" \
            "" \
            "    go install github.com/brettcallaghan/specs/cli/specs@$TAG" \
            "" \
            "**Or download a binary.** Each archive holds one statically linked executable and nothing else: unpack it and put \`specs\` on your PATH. Nothing further is fetched or executed at install time. Verify against \`SHA256SUMS\` first." \
            >> dist/notes.md
          cat dist/notes.md

      - name: Publish the release
        run: |
          set -euo pipefail
          expected="$(cd dist && ls -1 specs_* SHA256SUMS | sort)"

          if gh release view "$TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" = false ]; then
              # Published already: never rewrite its assets.
              remote="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
              if [ "$remote" != "$expected" ]; then
                echo "::error::$TAG is published but its assets differ from the expected set"
                diff <(echo "$expected") <(echo "$remote") || true
                exit 1
              fi
              echo "$TAG is already published with every asset"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "specs v$VERSION" --notes-file dist/notes.md
          fi

          gh release upload "$TAG" --clobber \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

          # Latest only when this is the highest stable version tagged, so a
          # maintenance release or a late re-run never moves it backwards.
          tags="$(git tag -l "$TAG_PREFIX*" --sort=-v:refname)"
          highest="$(printf '%s\n' "$tags" | grep -E "^${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+\$" || true)"
          highest="${highest%%$'\n'*}"
          latest=false
          [ "$highest" = "$TAG" ] && latest=true
          gh release edit "$TAG" --draft=false --latest="$latest"

      # Which artifacts reached the release and which did not, whatever step
      # failed.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Release ${TAG:-unresolved}"
            echo
            if ! gh release view "${TAG:-none}" --json isDraft,url,assets > release.json 2>/dev/null; then
              echo "No release created."
              exit 0
            fi
            jq -r '"draft: \(.isDraft)  \(.url)"' release.json
            echo
            remote="$(jq -r '.assets[].name' release.json | sort)"
            expected="$( (cd dist 2>/dev/null && ls -1 specs_* SHA256SUMS 2>/dev/null) | sort)"
            echo "| Asset | State |"
            echo "|---|---|"
            for name in $(printf '%s\n%s\n' "$expected" "$remote" | sort -u); do
              if printf '%s\n' "$remote" | grep -qxF "$name"; then
                echo "| $name | uploaded |"
              else
                echo "| $name | missing |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
